<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Stick+No+Bills:wght@200..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />

    <!-- Load Local Config and Shared Logic -->
    <script src="config.js"></script>
    <script src="app.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Theme Stylesheet -->
    <link rel="stylesheet" href="themes.css" />

    <style>
        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: var(--font-secondary, "Overpass", sans-serif);
            font-size: 12px;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .connected .status-dot {
            background-color: #00ff00;
            box-shadow: 0 0 4px #00ff00;
        }

        .disconnected .status-dot {
            background-color: #ff0000;
            box-shadow: 0 0 4px #ff0000;
        }

        .reconnecting .status-dot {
            background-color: #ffff00;
            box-shadow: 0 0 4px #ffff00;
        }

        /* Debug Console Styles */
        .debug-console {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background-color: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            overflow-y: auto;
            border-top: 1px solid #00ff00;
            z-index: 1000;
        }

        .debug-console.visible {
            display: block;
        }

        .debug-entry {
            margin: 2px 0;
            padding: 2px 0;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
        }

        .debug-entry .timestamp {
            color: #888;
            margin-right: 8px;
        }

        .debug-entry.error {
            color: #ff4444;
        }

        .debug-entry.warning {
            color: #ffaa00;
        }
    </style>
</head>

<body class="theme-classic">

    <div class="theme-selector">
        <select id="theme-dropdown">
            <option value="theme-classic">Classic Theme</option>
            <option value="theme-cyberpunk">Cyberpunk Dashboard</option>
            <option value="theme-literal">Literal Asphalt</option>
            <option value="theme-light">Light Kiosk</option>
        </select>
    </div>

    <div id="connection-status" class="connection-status disconnected">
        <span class="status-dot"></span>
        <span class="status-text">Disconnected</span>
    </div>

    <div class="parking-lot">
        <div class="sign">
            <div class="sign-top">
                RESERVED PARKING
            </div>
            <div class="sign-bottom">
                <i class="bi bi-ev-station-fill"></i>
            </div>
        </div>

        <div class="parking-line"></div>

        <div class="parking-space" id="space-spot1">
            1
            <br />
            <i id="spot1"></i>
            <br />
            <div id="spot1_timestamp" class="timestamp"></div>
        </div>

        <div class="parking-line"></div>

        <div class="parking-space" id="space-spot2">
            2
            <br />
            <i id="spot2"></i>
            <br />
            <div id="spot2_timestamp" class="timestamp"></div>
        </div>

        <div class="parking-line"></div>

        <div class="parking-space" id="space-spot3">
            3
            <br />
            <i id="spot3"></i>
            <br />
            <div id="spot3_timestamp" class="timestamp"></div>
        </div>

        <div class="parking-line"></div>

        <div class="parking-space" id="space-spot4">
            4
            <br />
            <i id="spot4"></i>
            <br />
            <div id="spot4_timestamp" class="timestamp"></div>
        </div>

        <div class="parking-line"></div>
    </div>

    <div id="debug-console" class="debug-console">
        <div id="debug-content"></div>
    </div>

</body>

<script type="text/javascript">
    // UI AND THEME PRESENTATION LAYER
    class UIManager {
        constructor(debugConsole) {
            this.debug = debugConsole;
            this.setupThemeSelector();
        }

        setupThemeSelector() {
            const dropdown = document.getElementById('theme-dropdown');
            const savedTheme = localStorage.getItem('parking-theme') || 'theme-classic';

            // Set initial theme
            document.body.className = savedTheme;
            dropdown.value = savedTheme;

            // Listen for changes
            dropdown.addEventListener('change', (e) => {
                const newTheme = e.target.value;
                document.body.className = newTheme;
                localStorage.setItem('parking-theme', newTheme);
                this.debug.log(`Theme changed to: ${newTheme}`);
            });
        }

        updateStatus(status) {
            const statusElement = document.getElementById('connection-status');
            const statusTextElement = statusElement.querySelector('.status-text');

            if (statusElement && statusTextElement) {
                statusElement.className = `connection-status ${status}`;
                let displayText = status.charAt(0).toUpperCase() + status.slice(1);
                if (status === 'connected') {
                    displayText = 'Real-time (Firebase)';
                } else if (status === 'reconnecting') {
                    displayText = 'Connecting';
                }
                statusTextElement.textContent = displayText;
            }
        }

        renderSpots(spots) {
            for (const spot of spots) {
                // Update parent container class for theme targeting
                const spaceContainer = document.getElementById(`space-${spot.id}`);
                if (spaceContainer) {
                    spaceContainer.className = `parking-space ${spot.status}`;
                }

                const iconElement = document.getElementById(spot.id);
                const timestampElement = document.getElementById(`${spot.id}_timestamp`);

                if (iconElement) {
                    // We only manage the icon class here. The colors/borders are managed by themes.css
                    iconElement.className = spot.status === 'unoccupied' ? 'bi bi-check2-square' : 'bi bi-x-square';
                    // Clear hardcoded inline styles so CSS can take over
                    iconElement.style = '';
                }

                if (timestampElement) {
                    timestampElement.innerText = new Date(spot.timestamp).toLocaleTimeString();
                }
            }
        }
    }

    // App Initialization
    window.addEventListener('load', () => {
        const debugConsole = new DebugConsole();
        const uiManager = new UIManager(debugConsole);

        // Pass callbacks to FirebaseManager so it doesn't touch the DOM directly
        new FirebaseManager(
            debugConsole,
            (spots) => uiManager.renderSpots(spots),
            (status) => uiManager.updateStatus(status)
        );
    });
</script>

</html>
