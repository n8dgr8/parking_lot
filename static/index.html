<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Stick+No+Bills:wght@200..800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet" />

    <!-- Load Local Config -->
    <script src="config.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            background-color: #333333;
        }

        .title {
            color: yellow;
            text-align: center;
        }

        .parking-lot {
            min-height: 200px;
            display: flex;
        }

        .parking-space {
            width: 100px;
            color: yellow;
            text-align: center;
            font-size: 80px;
            font-family: "Stick No Bills", sans-serif;
            font-optical-sizing: auto;
            font-weight: 700;
            font-style: bold;
        }

        .parking-line {
            width: 12px;
            background-color: yellow;
            border-radius: 3px;
        }

        .sign {
            break-after: auto;
            width: 160px;
            border: 2px solid white;
            border-radius: 8px;
            font-family: "Overpass", sans-serif;
            font-size: 30px;
            text-align: center;
            line-break: auto;
            padding: 6px;
            background-color: green;
            margin-right: 18px;
        }

        .sign-top {
            background-color: green;
            border-radius: 8px;
            height: 40%;
            color: white;
        }

        .sign-bottom {
            background-color: white;
            border-radius: 8px;
            padding-top: 16px;
            color: green;
            font-size: 72px;
        }

        .timestamp {
            font-size: 10px;
            color: white;
            font-family: "Overpass", sans-serif;
        }

        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: "Overpass", sans-serif;
            font-size: 12px;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .connected .status-dot {
            background-color: #00ff00;
            box-shadow: 0 0 4px #00ff00;
        }

        .disconnected .status-dot {
            background-color: #ff0000;
            box-shadow: 0 0 4px #ff0000;
        }

        .reconnecting .status-dot {
            background-color: #ffff00;
            box-shadow: 0 0 4px #ffff00;
        }

        /* Debug Console Styles */
        .debug-console {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background-color: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            overflow-y: auto;
            border-top: 1px solid #00ff00;
            z-index: 1000;
        }

        .debug-console.visible {
            display: block;
        }

        .debug-entry {
            margin: 2px 0;
            padding: 2px 0;
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
        }

        .debug-entry .timestamp {
            color: #888;
            margin-right: 8px;
        }

        .debug-entry.error {
            color: #ff4444;
        }

        .debug-entry.warning {
            color: #ffaa00;
        }
    </style>
</head>

<body>
    <div id="connection-status" class="connection-status disconnected">
        <span class="status-dot"></span>
        <span class="status-text">Disconnected</span>
    </div>

    <div class="parking-lot">
        <div class="sign">
            <div class="sign-top">
                RESERVED PARKING
            </div>
            <div class="sign-bottom">
                <i class="bi bi-ev-station-fill"></i>
            </div>
        </div>

        <div class="parking-line"></div>

        <div class="parking-space">
            1
            <br />
            <i id="spot1"></i>
            <br />
            <div id="spot1_timestamp" class="timestamp"></div>
        </div>

        <div class="parking-line"></div>

        <div class="parking-space">
            2
            <br />
            <i id="spot2"></i>
            <br />
            <div id="spot2_timestamp" class="timestamp"></div>
        </div>

        <div class="parking-line"></div>

        <div class="parking-space">
            3
            <br />
            <i id="spot3"></i>
            <br />
            <div id="spot3_timestamp" class="timestamp"></div>
        </div>

        <div class="parking-line"></div>

        <div class="parking-space">
            4
            <br />
            <i id="spot4"></i>
            <br />
            <div id="spot4_timestamp" class="timestamp"></div>
        </div>

        <div class="parking-line"></div>
    </div>

    <div id="debug-console" class="debug-console">
        <div id="debug-content"></div>
    </div>

</body>

<script type="text/javascript">
    class DebugConsole {
        constructor() {
            this.console = document.getElementById('debug-console');
            this.content = document.getElementById('debug-content');
            this.isVisible = false;
            this.maxEntries = 100;
            this.setupKeyboardListener();
        }

        toggle() {
            this.isVisible = !this.isVisible;
            this.console.classList.toggle('visible');
        }

        log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `debug-entry ${type}`;

            const timestamp = document.createElement('span');
            timestamp.className = 'timestamp';
            timestamp.textContent = new Date().toLocaleTimeString();

            const content = document.createElement('span');
            content.className = 'content';
            content.textContent = message;

            entry.appendChild(timestamp);
            entry.appendChild(content);

            this.content.appendChild(entry);

            // Limit the number of entries
            while (this.content.children.length > this.maxEntries) {
                this.content.removeChild(this.content.firstChild);
            }

            // Auto-scroll to bottom
            this.console.scrollTop = this.console.scrollHeight;
        }

        error(message) {
            this.log(message, 'error');
        }

        warning(message) {
            this.log(message, 'warning');
        }

        setupKeyboardListener() {
            document.addEventListener('keydown', (event) => {
                if (event.key === '`' || event.key === '~') {
                    this.toggle();
                }
            });
        }
    }

    class FirebaseManager {
        constructor() {
            this.projectId = (window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.projectId) || "your-gcp-project-id";
            this.db = null;
            this.debug = new DebugConsole();
            this.isFirstLoad = true;

            this.initialize();
        }

        initialize() {
            try {
                this.updateStatus('reconnecting');
                this.debug.log(`Initializing Firebase for project: ${this.projectId}`);

                // Initialize Firebase Compat
                firebase.initializeApp({
                    projectId: this.projectId
                });

                this.db = firebase.firestore();
                this.debug.log('Firebase initialized. Setting up real-time Firestore listener...');

                this.setupListener();
            } catch (error) {
                this.debug.error(`Firebase init error: ${error.message}`);
                this.updateStatus('disconnected');
            }
        }

        setupListener() {
            this.db.collection("spots").doc("state").onSnapshot(
                (doc) => {
                    this.updateStatus('connected');
                    const spots = [];
                    const data = doc.exists ? doc.data() : {};

                    for (let i = 1; i <= 4; i++) {
                        const spotKey = `spot${i}`;
                        const spotData = data[spotKey] || { status: 'unoccupied', timestamp: Date.now() };
                        spots.push({
                            id: spotKey,
                            status: spotData.status,
                            timestamp: spotData.timestamp
                        });
                    }

                    if (!doc.exists) {
                        this.debug.warning('No spot state document found. Using default unoccupied state.');
                    } else {
                        this.debug.log(`Received real-time update for ${spots.length} spots`);
                    }

                    this.updateParkingSpots(spots);
                },
                (error) => {
                    this.debug.error(`Firestore error: ${error.message}`);
                    this.updateStatus('disconnected');
                }
            );
        }

        updateParkingSpots(spots) {
            for (const spot of spots) {
                const iconClass = spot.status === 'unoccupied' ? 'bi bi-check2-square' : 'bi bi-x-square';
                const iconStyle = spot.status === 'unoccupied' ? 'color: green;' : 'color: red;';

                const iconElement = document.getElementById(spot.id);
                const timestampElement = document.getElementById(`${spot.id}_timestamp`);

                if (iconElement) {
                    iconElement.className = iconClass;
                    iconElement.style = iconStyle;
                }

                if (timestampElement) {
                    timestampElement.innerText = new Date(spot.timestamp).toLocaleTimeString();
                }
            }
        }

        updateStatus(status) {
            const statusElement = document.getElementById('connection-status');
            const statusTextElement = statusElement.querySelector('.status-text');

            if (statusElement && statusTextElement) {
                statusElement.className = `connection-status ${status}`;

                let displayText = status.charAt(0).toUpperCase() + status.slice(1);
                if (status === 'connected') {
                    displayText = 'Real-time (Firebase)';
                } else if (status === 'reconnecting') {
                    displayText = 'Connecting';
                }

                statusTextElement.textContent = displayText;
                this.debug.log(`Status updated to: ${displayText}`);
            }
        }
    }

    // Initialize Firebase manager when the page loads
    window.addEventListener('load', () => {
        new FirebaseManager();
    });
</script>

</html>
